aid: bge-com
name: BGE (Baltimore Gas and Electric)
description: Baltimore Gas and Electric (BGE), an Exelon subsidiary, is the gas and electric utility serving
  central Maryland. No public developer API or OpenAPI contract was found; customer usage data is exposed
  through Green Button Download My Data, and third-party data access runs through supplier portal requests
  under customer authorization rather than a documented API.
