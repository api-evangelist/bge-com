  finding: Contract discovery on api.bge.com and www.bge.com found no OpenAPI, AsyncAPI, GraphQL or MCP.
    www.bge.com returns a ~3KB bot-protection shell to non-browser clients for every path, so Green Button
    pages could not be read directly. BGE announced Green Button Connect My Data support in 2012 (BusinessWire);
    no current BGE or Exelon page confirming a live CMD/ESPI third-party registration was found. Third-party
    guides describe supplier data access via a supplier portal with customer letter of authorization,
    delivering XML files, not a public API.
